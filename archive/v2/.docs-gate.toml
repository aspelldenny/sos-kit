# sos-kit dogfood — docs-gate config tuned for sos-kit's own docs structure.
# Schema: flat-string v0.1.0
#
# v2.2 doctrine: hooks + watchlist sensors, NO hook tiering until N4 sensor fires.
# Reference: ~/sos-kit/docs/WORKFLOW_V2.2.md §9 (Hook tiering REMOVED — bệnh giả định).
# Tier 1/2/3 schema NOT introduced here; mọi gate hiện tại là single-tier block-on-violation.
# Khi N4 fires (pre-commit > 10s OR first --no-verify) → retro vòng 3 tier hóa chính đáng.

docs_dir = "docs"

# Changelog is at repo root (not docs/CHANGELOG.md — verified anchor #11).
# Path is relative to docs_dir, so "../CHANGELOG.md" resolves to repo root.
changelog = "../CHANGELOG.md"
changelog_max_age_days = 1
# changelog_staged disabled: docs-gate v0.1.0 path normalization bug — when changelog
# path contains "../" (needed because docs_dir="docs" but CHANGELOG.md is at repo root),
# the staged-files check compares "docs/../CHANGELOG.md" which never matches git's "CHANGELOG.md".
# Age check (changelog_max_age_days) still enforces freshness.
changelog_staged = false

rules = []
staleness = []
doc_structure = []
count_check = []
cross_doc = []

[architecture]
# sos-kit uses LAYERS.md as its primary architecture doc.
# enabled = true (Sếp catch 2026-05-28: disable check = lose primary docs drift detection).
# required_sections = 0 (flexible — foundation docs span LAYERS+PHILOSOPHY+HANDOFF, not single file).
enabled = true
file = "LAYERS.md"
required_sections = 0
required_non_empty = []

[ticket]
# Phiếu pattern: docs/ticket/ (active) → docs/ticket/done/ (archive). Unified 2026-05-29
# (was phieu/active|done — migrated to single path, matches downstream default; no dogfood exception).
ticket_dir = "docs/ticket"
type_pattern = ""
valid_types = []
exclude_files = []
