# Release CI — prebuilt `sos` binaries for the sos-kit installer (P081 Stage 1).
# Trigger: push a tag `v*` (e.g. v0.1.0). Builds mac-arm64, linux-x64 and windows-x64
# (each tested in ci.yml on every PR) and attaches them to a GitHub Release.
# Windows: the POD-agent machine built from source until v0.3.11; install.sh in Git Bash now
# downloads sos-x86_64-pc-windows-msvc.exe.
# Asset naming contract (consumed by sos-kit install.sh): <bin>-<target-triple>[.exe]
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install gitleaks
      - run: cargo test --locked --workspace
      - run: tests/adapters/run.sh
      - run: cargo build --locked -p sos-cli && tests/smoke.sh target/debug/sos
      - run: tests/npm.sh   # also: the tag matches the version the package pins

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p sos-cli --target ${{ matrix.target }}
      - name: Package asset
        shell: bash
        run: |
          BIN=sos
          EXT=""
          [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          cp "target/${{ matrix.target }}/release/${BIN}${EXT}" "${BIN}-${{ matrix.target }}${EXT}"
          echo "ASSET=${BIN}-${{ matrix.target }}${EXT}" >> "$GITHUB_ENV"
          # sha256: prefer sha256sum (linux), fall back to shasum -a 256 (mac)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${BIN}-${{ matrix.target }}${EXT}" > "${BIN}-${{ matrix.target }}${EXT}.sha256"
          else
            shasum -a 256 "${BIN}-${{ matrix.target }}${EXT}" > "${BIN}-${{ matrix.target }}${EXT}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  # One job creates the release with every asset. v0.3.11: three build jobs each created a draft
  # (a race), the empty one was published, and releases are immutable, so that tag cannot be reused.
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: All assets present
        run: |
          for t in aarch64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc.exe; do
            for f in "dist/sos-$t" "dist/sos-$t.sha256"; do
              [ -s "$f" ] || { echo "missing $f"; exit 1; }
            done
          done
      # Draft first, published only once every asset is on it: a published release is immutable.
      - name: Create and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""; [[ "$TAG" == *-rc* ]] && pre="--prerelease"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" $pre
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # The npm package against the release just published: installed without its install
  # script (npm 12's default), the first `sos` call must fetch and run this version.
  npm-check:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: tests/npm.sh --real
