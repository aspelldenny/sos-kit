# CI — every pull request and every push to main: Rust tests, adapter tests, and an
# end-to-end install smoke with the built binary.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install gitleaks
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install gitleaks
          else
            V=8.30.1
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          fi
          gitleaks version
      - run: cargo test --locked --workspace
      - run: tests/adapters/run.sh
      - run: cargo build --locked -p sos-cli
      - run: tests/smoke.sh target/debug/sos
