# SOS Kit gate rules for this project. Reference: harness-lite/README.md. Unknown keys are errors.

[stage]
# Where this app is in the A→K process: A research, B product page (SOUL), C demand test, D repo,
# E blueprint, F visual design, G skeleton, H growth and review, I launch prep, J launch and measure,
# K decision. `sos stage` prints the table, what is missing and what comes next.
# Right after `sos install`: current = "D", with A–C backfilled below in the same commit.
current = ""

[stage.gates]
# One line per passed stage: X = "YYYY-MM-DD | evidence" (a path or a command), or "bỏ qua | reason"
# when it was skipped; F may say "mặc định | reason" to keep the default UI (F runs alongside G, needed
# before H). The pre-commit blocks a stage written over an earlier one with nothing (`sos gate stage`).
# A = "2026-11-10 | research/SPY-notes.md"
# B = "2026-11-12 | docs/SOUL.md"
# C = "bỏ qua | build now, measure after launch"

# [stage.reads]
# What this app's people read at a stage besides the kit's own files; `sos stage` prints it with the
# next step. Useful for A–C and I–K, whose playbooks live outside the kit.
# I = ["<path to your launch checklist>"]

[text]
# Staged files whose wording is checked (globs). Empty = wording gate off.
files = []
# Case-insensitive phrases users must never see.
banned = []
# Case-insensitive regexes for internal leaks (base list of AI vendor names is on by default).
leaks = []
# base = false            # turn off the built-in vendor-name list (e.g. a project about AI)

[docs]
# State docs that must stay small. Warn at `soft` lines, block at `hard`.
files = ["docs/BACKLOG.md"]
soft = 1000
hard = 1500
# Docs agents load at session start: the banner shows only the start of each line, and all of it costs
# tokens every session. Over a limit blocks the commit. Empty `sized` = off.
sized = ["docs/BACKLOG.md"]
max_bytes = 32768
max_item_chars = 1000
# Docs whose relative links and anchors must resolve (`sos gate links`). Empty = off.
links = ["AGENTS.md", "docs/BACKLOG.md"]

[ready]
# The one command that checks the whole product (build plus end-to-end), run before a handover by
# `sos gate ready`, which records revision and result in evidence/ready/. e.g. "make ready"
cmd = ""

[blueprint]
# Journeys with concrete examples, data model, irreversible actions (template: harness-lite/templates/BLUEPRINT.md).
# `sos gate blueprint` checks the three parts are filled, before Người soát reviews it and before building.
file = "docs/BLUEPRINT.md"

[features]
file = "docs/FEATURES.json"
allow_regression = true   # a passed slice may honestly go back to false; ids may never be deleted

[git]
protect_default_branch = false   # true: non-Markdown commits must be made on a branch

[ledger]
# Every fix commit (subject "fix…", "hotfix…", "Sửa…") ends with `Caught-by: <layer>`: what found the defect
# (gate, test, bite, reviewer, advisor, owner, user, prod), and `Escaped-from: <stage>`: the stage of the work
# that let it through (blueprint, skeleton, growth, review). The commit-msg hook enforces it; `sos score` counts it.
require = true
stage = true              # false: do not ask for `Escaped-from:`
fix = ""                  # subject regex for a fix commit; empty: the built-in one above

[advisor]
# After `after` consecutive failing test runs, the agent's hook asks a stronger model for direction
# (`sos advise`); at most `max` calls per failing streak. Log: .advise-state/calls.jsonl
backend = "claude"        # claude | codex | auto (the other model family than the agent at work) | off
model = ""                # empty: opus for claude, the Codex config default for codex
effort = ""                # empty: the CLI default
after = 2
max = 2
tests = []                # your own test commands besides pytest, npm test, cargo test …, e.g. ["node scripts/check.mjs"]

[bite]
# `sos bite`: do the tests of a change catch a wrong version of it? Run by Người soát
# on slices that add or change logic. Empty `test` = not set up. Per-test verdicts need verbose output.
test = ""                 # e.g. "python3 -m unittest discover -s tests -t . -v", "swift test", "npx vitest run --reporter=verbose src/lib/", "cargo test -p core"
cwd = "."                 # where `test` runs
src = ''                  # regex of source files to mutate, e.g. '^App/Domain/.*\.swift$'
tests = ''                # regex of test files, e.g. 'Tests/'
mutants = 8               # each mutant runs `test` once: keep `test` narrow for slow suites

[state]
# The doc that says what is being worked on now: session-start status and advisor intent read its first `## ` section.
file = "docs/BACKLOG.md"

# Model and effort per role, the one table everything follows: `sos role` (runs a role from any agent,
# prompt on closed stdin, with a timeout), `sos check` (compares .claude/agents/*.md with it).
# Builders at medium, checks at high. When codex is on PATH, `sos install` writes Người soát from the other
# model family, keyed by who built the work ([roles.reviewer.claude] backend = "codex", and the reverse).
[roles.architect]
backend = "claude"
model = "opus"
effort = "high"

[roles.worker]
backend = "claude"
model = "sonnet"
effort = "medium"

[roles.reviewer]
backend = "claude"
model = "opus"
effort = "high"
