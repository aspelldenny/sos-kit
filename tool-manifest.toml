# tool-manifest.toml — pin sister-tool version + per-platform asset + checksum (OA-07, P077d3).
#
# Committed KIT config (kit root) — NOT generated, NOT gitignored. This is
# DIFFERENT from `.sos-manifest.toml` (P077d2, generated PROJECT artifact
# that tracks files installed INTO a project). tool-manifest.toml pins the
# EXTERNAL sister binaries (doctor/ship/docs-gate/...) that a project's
# tooling depends on — the thing we PULL IN, not the thing we RAN OUT.
#
# required = true  → tool missing or older-than-pinned makes `sos tools
#                     status` / `sos doctor`-surface / install step-5 FAIL
#                     (exit != 0). Matches install.sh's BINARIES list.
# required = false → warn-skip only, never flips exit code. Matches
#                     install.sh's OPTIONAL_BINARIES list.
#
# Keys of [tool.asset] / [tool.checksum] = the 3 target-triple install.sh
# resolves to (install.sh:52-60): aarch64-apple-darwin,
# x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc (Intel Mac runs the
# arm64 binary via Rosetta — no 4th triple, install.sh:57-58).
#
# version = pinned value, filled from each sister tool's OWN source
# Cargo.toml (live-checked 2026-07-22 against local `~/<tool>` checkouts —
# NOT `releases/latest`, which is exactly the OA-07 unpinned-drift bug).
# Re-fill when a tool cuts a new release meant to become the new floor.
#
# checksum = sha256 hex per platform, keyed to the pinned version's release
# asset. FILLED P081 Stage 1 (2026-07-23) — real sha256 fetched from each
# sister repo's published GitHub Release asset digest at the pinned version
# (`gh release view v<pin> --repo aspelldenny/<tool> --json assets`, digest
# field, cross-checked against companion `.sha256` file where present).
# Only exception: advisory-cron's Windows triple — kept as TODO + comment,
# no asset exists there by design (compile_error! on Windows). install.sh's
# EXISTING integrity check (fetch + recompute + compare a companion
# `.sha256` file, P071) is unrelated and unaffected — it verifies the ASSET
# CHOSEN, this manifest pins the VERSION+ASSET+CHECKSUM to select.

# ── required (6) — matches install.sh:40 BINARIES ──────────────────────────

