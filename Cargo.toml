[workspace]
# Workspace: crates/sos-cli (the `sos` binary) and crates/sos-gates (the gates).
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# shared version pin — deps split across crates by need
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
walkdir = "2"
