[workspace]
# P077b — carved into virtual workspace (5 crates under crates/*).
# Root stays at bootstrap/sos-rs/, NOT repo-root — relocation is P077e.
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# shared version pin — deps split across crates by need
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
walkdir = "2"
