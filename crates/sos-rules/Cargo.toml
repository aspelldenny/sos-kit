[package]
name = "sos-rules"
version = "0.1.0"
edition = "2021"
description = "SOS Kit v3 declarative hook rules (`sos hook rules`): shell reader, rules file, matching, cases runner"
license = "MIT"

[dependencies]
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sos-gates = { path = "../sos-gates" }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
