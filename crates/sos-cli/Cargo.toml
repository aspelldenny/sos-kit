[package]
name = "sos-cli"
version = "0.3.4"
edition = "2021"
description = "SOS Kit v3 CLI (binary `sos`): install/update/check the harness in a repo, and run its gates"
license = "MIT"
build = "build.rs"

[[bin]]
name = "sos"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sos-gates = { path = "../sos-gates" }

[dev-dependencies]
tempfile = "3"
