[package]
name = "sos-cli"
version = "0.3.13"
edition = "2021"
description = "SOS Kit v3 CLI (binary `sos`): install/update/check the harness in a repo, and run its gates"
license = "MIT"
build = "build.rs"

[[bin]]
name = "sos"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }  # `sos update --wiring` keeps the key order of project files
sos-gates = { path = "../sos-gates" }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
