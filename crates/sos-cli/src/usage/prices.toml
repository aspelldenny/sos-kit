# Comparison prices for `sos usage`, USD per 1M tokens. A unit for comparing roles and models,
# not a bill. Source: the Anthropic model table as cached on 2026-10-06 (input, output, and the
# cache-read prices it lists); where it lists none, cache write = 1.25 × input (5 minutes) or
# 2 × input (1 hour) and cache read = 0.1 × input. Override with --prices FILE or
# ~/.config/sos/prices.toml (same layout). Models not listed show "—".
